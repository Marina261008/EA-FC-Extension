<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#E5A600" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#0F141D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield Background -->
  <path d="M 64 6 L 114 26 C 114 80 64 122 64 122 C 64 122 14 80 14 26 Z" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <!-- Inner Border -->
  <path d="M 64 14 L 106 31 C 106 75 64 112 64 112 C 64 112 22 75 22 31 Z" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- Star in Center -->
  <path d="M 64 28 L 73 49 L 96 51 L 79 66 L 84 89 L 64 77 L 44 89 L 49 66 L 32 51 L 55 49 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Bottom Banner Arc / Text Accent -->
  <path d="M 40 98 Q 64 106 88 98" fill="none" stroke="#00FF87" stroke-width="3" stroke-linecap="round" />
  <circle cx="64" cy="102" r="3" fill="#00FF87" />
</svg>
